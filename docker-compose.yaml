services:
    api:
        build:
            context: .
            dockerfile: ubuntu.dockerfile
        ports:
            - 80:80
        volumes:
            - ./api:/var/www/html/public
        container_name: api
        # depends_on:
        #     - mysql
        networks:
            - gus-php-network

networks:
    gus-php-network:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: "12.0.0.0/16"
